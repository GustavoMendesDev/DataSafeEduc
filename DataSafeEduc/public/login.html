<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataSafe | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="icon" href="./assets/imgs/logo.png" type="img">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-straight/css/uicons-regular-straight.css">


</head>

<main>

    <div class="container-formulario">

        <a class="ancora" href="./index.html"><img class="voltar" src="./assets/icon/arrow_back.png" alt=""></a>

        <img src="./assets/imgs/datasafe-removebg-preview.png" alt="">



        <div class="input">
            <label for="email" id="email">Endereço de e-mail:</label><br>
            <input type="text" id="iptEmail">
        </div>

 <div class="input">
  <label for="senha" id="senha">Senha:</label><br>
  <div class="input-senha-wrapper">
    <input type="password" id="iptSenha">
    <i class="fi fi-rs-eye toggle-senha" id="toggleSenha"></i>
  </div>
</div>
        <button onclick="entrar()">Entrar</button>

        <p class="sub-titulo">Ainda não tem uma conta? <a href="./cadastro">Cadastre-se</a></p>
    </div>

    <div class="container">
        <h1 class="titulo">Bem-vindo de volta à DataSafe!</h1>


    </div>

</main>
</body>

</html>

<script>


const toggleSenha = document.getElementById('toggleSenha');
const iptSenha = document.getElementById('iptSenha');

toggleSenha.addEventListener('click', function () {
  if (iptSenha.type === 'password') {
    iptSenha.type = 'text';
    toggleSenha.classList.remove('fi-rs-eye');
    toggleSenha.classList.add('fi-rs-crossed-eye');
  } else {
    iptSenha.type = 'password';
    toggleSenha.classList.remove('fi-rs-crossed-eye');
    toggleSenha.classList.add('fi-rs-eye');
  }
});

    function entrar() {
        // aguardar();

        var emailVar = iptEmail.value;
        var senhaVar = iptSenha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        setTimeout(function () {
            window.location = "views/dash-monitoramento.html";
        }, 1000); // apenas para exibir o loading

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000);

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
