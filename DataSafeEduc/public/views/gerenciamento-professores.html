<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Gerenciamento de Professores</title>

    <link
      rel="stylesheet"
      href="../css/gerenciamento-de-professores-educacional.css"
    />
    <link rel="stylesheet" href="../css/layout.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Sora:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dashboard-container">
      <aside class="barra-lateral">
        <div class="perfil-lateral">
          <p class="nome-perfil">Lavínia Todarelli</p>
          <p class="cargo-perfil">Administrador</p>
        </div>
        <nav class="nav-lateral">
           <a href="analise-desempenho.html"> <button class="nav-btn">Análise e Desempenho por Tema</button></a>
          <a href="dash-monitoramento.html"
            ><button class="nav-btn">
              Monitoramento de Desempenho por habilidade
            </button></a
          >
          <a href="lista-desempenho.html"
            ><button class="nav-btn">Lista de Desempenho por questão</button></a
          >
          <a href="simulados.html"
            ><button class="nav-btn">Simulados</button></a
          >
          <a href="gerenciamento-professores.html"
            ><button class="nav-btn active">Gerenciamento de professores</button></a
          >
          <a href="gerenciamento-coordenadores.html"
            ><button class="nav-btn">Gerenciamento de Coordenadores</button></a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="dashboard-header">
          <h1>Gerenciamento de Professores</h1>
        </header>

        <div class="dashboard-content">
          <div class="card">
            <div
              class="card-title-row"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <h2>Lista de usuários</h2>
              <button class="btn-add" onclick="abrirModal()">
                Adicionar usuário
              </button>
            </div>

            <div class="card-content table-container">
              <table class="details-table">
                <thead>
                  <tr>
                    <th>Cod</th>
                    <th>Email</th>
                    <th>Senha</th>
                    <th>Cargo</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                  </tr>
                </thead>

                <tbody id="tbodyProfessores">
                  </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal" id="modalCadastro">
      <div class="modal-box">
        <h2>Cadastro de Usuário</h2>

        <input placeholder="Email" id="email"/>
        <input type="password" placeholder="Senha" id="senha"/>
        <input type="password" placeholder="Confirmar senha" id="confirmarSenha"/>

        <select id="cargoSelect">
          <option value="Professor">Professor</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="cadastrarProfessor()">Cadastrar</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modalEditar">
      <div class="modal-box">
        <h2>Editar cadastro Professor</h2>

        <input placeholder="Email" id="editarEmail" />
        <input type="password" placeholder="Nova senha" id="editarSenha" />
        <input type="hidden" id="editarId" />

        <select disabled>
          <option>Professor</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharEditar()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="atualizarProfessor()">Atualizar</button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", carregarProfessores);

      function limparCadastro() {
        email.value = "";
        senha.value = "";
        confirmarSenha.value = "";
      }

      function buscarFkCursinho() {
        return sessionStorage.FK_CURSINHO || sessionStorage.fkCursinho || "";
      }

      function carregarProfessores() {
        var fkCursinho = buscarFkCursinho();

        fetch(`/professores?fkCursinho=${fkCursinho}`) // Rota adaptada para buscar os professores
          .then((resposta) => resposta.ok ? resposta.json() : [])
          .then((professores) => {
            if (!professores || professores.length == 0) {
              tbodyProfessores.innerHTML = `
                <tr>
                  <td colspan="6">Nenhum professor encontrado</td>
                </tr>
              `;
              return;
            }

            tbodyProfessores.innerHTML = professores.map((professor) => `
              <tr>
                <td>${String(professor.id).padStart(2, "0")}</td>
                <td>${professor.email || professor.nome}</td>
                <td>${professor.senha ? "********" : ""}</td>
                <td>${professor.cargo || "Professor"}</td>
                <td>
                  <button class="icon-btn" onclick="abrirEditar(${professor.id}, '${escaparTexto(professor.email || professor.nome)}')">
                    ✏️
                  </button>
                </td>
                <td>
                  <button class="icon-btn" onclick="excluirProfessor(${professor.id})">🗑️</button>
                </td>
              </tr>
            `).join("");
          })
          .catch((erro) => console.log("Erro ao buscar professores", erro));
      }

      function cadastrarProfessor() {
        var emailProfessor = email.value;
        var senhaProfessor = senha.value;
        var confirmarSenhaProfessor = confirmarSenha.value;

        if (emailProfessor == "" || senhaProfessor == "" || confirmarSenhaProfessor == "") {
          alert("Preencha todos os campos.");
          return false;
        }

        if (senhaProfessor !== confirmarSenhaProfessor) {
          alert("As senhas não coincidem.");
          return false;
        }

        fetch("/professores/cadastrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailProfessor,
            senha: senhaProfessor,
            confirmarSenha: confirmarSenhaProfessor,
            fkCursinho: buscarFkCursinho()
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharModal();
            limparCadastro();
            carregarProfessores();
          })
          .catch((erro) => alert("Erro ao cadastrar professor: " + erro));
      }

      function atualizarProfessor() {
        var id = editarId.value;
        var emailProfessor = editarEmail.value;
        var senhaProfessor = editarSenha.value;

        if (emailProfessor == "") {
          alert("Preencha o email.");
          return false;
        }

        fetch(`/professores/${id}?fkCursinho=${buscarFkCursinho()}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailProfessor,
            senha: senhaProfessor
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharEditar();
            carregarProfessores();
          })
          .catch((erro) => alert("Erro ao atualizar professor: " + erro));
      }

      function excluirProfessor(id) {
        if (confirm("Tem certeza que deseja excluir este professor?")) {
          fetch(`/professores/${id}?fkCursinho=${buscarFkCursinho()}`, { method: "DELETE" })
            .then((resposta) => {
              if (resposta.ok) {
                carregarProfessores();
              } else {
                return resposta.text().then((mensagem) => Promise.reject(mensagem));
              }
            })
            .catch((erro) => alert("Erro ao excluir professor: " + erro));
        }
      }

      function escaparTexto(texto) {
        return String(texto || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
      }

      function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
      }

      function abrirEditar(id, emailProfessor) {
        editarId.value = id;
        editarEmail.value = emailProfessor || "";
        editarSenha.value = "";
        document.getElementById("modalEditar").style.display = "flex";
      }

      function fecharEditar() {
        document.getElementById("modalEditar").style.display = "none";
      }
    </script>
  </body>
</html>
