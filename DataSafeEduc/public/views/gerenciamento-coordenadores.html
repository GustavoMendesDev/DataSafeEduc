      <!-- MAIN -->
      <main class="main-content">

    <!-- MODAL CADASTRO -->
    <div class="modal" id="modalCadastro">
      <div class="modal-box">
        <h2>Cadastro de Coordenador</h2>

        <input placeholder="Nome" id="nome"/>
        <span id="erroNome" class="msg-erro"></span>

        <input placeholder="Email" id="email"/>
        <span id="erroEmail" class="msg-erro"></span>

        <input type="password" placeholder="Senha" id="senha" />
        <span id="erroSenha" class="msg-erro"></span>

        <input type="password" placeholder="Confirmar senha" id="confirmarSenha" />
        <span id="erroConfirmarSenha" class="msg-erro"></span>

        <select>
          <option>Coordenador</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="cadastrarCoordenador()">Cadastrar</button>
        </div>
      </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal" id="modalEditar">
      <div class="modal-box">
        <h2>Editar coordenador</h2>

        <input placeholder="Nome" id="editarNome" />
        <span id="erroEditarNome" class="msg-erro"></span>

        <input placeholder="Email" id="editarEmail" />
        <span id="erroEditarEmail" class="msg-erro"></span>

        <input type="password" placeholder="Nova senha (opcional)" id="editarSenha" />
        <span id="erroEditarSenha" class="msg-erro"></span>

        <input type="hidden" id="editarId" />

        <select>
          <option>Gestor</option>
          <option>Coordenador</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharEditar()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="atualizarCoordenador()">Atualizar</button>
        </div>
      </div>
    </div>

    <script src="../js/sessao.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", carregarCoordenadores);

      function limparCadastro() {
        nome.value = "";
        email.value = "";
        senha.value = "";
        confirmarSenha.value = "";
      }

      function limparErrosModal(tipo) {
        if (tipo === 'cadastro') {
          document.getElementById('erroNome').style.display = 'none';
          document.getElementById('erroEmail').style.display = 'none';
          document.getElementById('erroSenha').style.display = 'none';
          document.getElementById('erroConfirmarSenha').style.display = 'none';
         
        } else {
          document.getElementById('erroEditarNome').style.display = 'none';
          document.getElementById('erroEditarEmail').style.display = 'none';
          document.getElementById('erroEditarSenha').style.display = 'none';
          
        }
      }

      function buscarFkCursinho() {
        return sessionStorage.FK_CURSINHO || sessionStorage.fkCursinho || "";
      }

      function carregarCoordenadores() {
        fetch("/coordenadores")
          .then((resposta) => resposta.ok ? resposta.json() : [])
          .then((coordenadores) => {
            if (!coordenadores || coordenadores.length == 0) {
              tbodyCoordenadores.innerHTML = `
                <tr>
                  <td colspan="6">Nenhum coordenador encontrado</td>
                </tr>
              `;
              return;
            }

            tbodyCoordenadores.innerHTML = coordenadores.map((coordenador) => `
              <tr>
                <td>${String(coordenador.nome)}</td>
                <td>${coordenador.email}</td>
                <td>${coordenador.cargo || ""}</td>
                <td>
                  <button class="icon-btn" onclick="abrirEditar(${coordenador.id}, '${escaparTexto(coordenador.nome)}', '${escaparTexto(coordenador.email)}')">
  ✏️
</button>
                </td>
                <td>
                  <button class="icon-btn" onclick="excluirCoordenador(${coordenador.id})">🗑️</button>
                </td>
              </tr>
            `).join("");
          })
          .catch((erro) => console.log("Erro ao buscar coordenadores", erro));
      }

      function cadastrarCoordenador() {
        var nomeCoordenador = nome.value.trim();
        var emailCoordenador = email.value.trim();
        var senhaCoordenador = senha.value.trim();
        var confirmarSenhaCoordenador = confirmarSenha.value.trim();
        var validacaoOk = true;

        limparErrosModal('cadastro');

        if (nomeCoordenador == "") {
          document.getElementById('erroNome').innerHTML = "Preencha o nome.";
          document.getElementById('erroNome').style.display = 'block';
          validacaoOk = false;
        }

        if (emailCoordenador == "" || emailCoordenador.indexOf("@") == -1) {
          document.getElementById('erroEmail').innerHTML = "Insira um e-mail válido.";
          document.getElementById('erroEmail').style.display = 'block';
          validacaoOk = false;
        }

        if (senhaCoordenador == "" || senhaCoordenador.length < 6) {
          document.getElementById('erroSenha').innerHTML = "A senha deve ter no mínimo 6 caracteres.";
          document.getElementById('erroSenha').style.display = 'block';
          validacaoOk = false;
        }

        if (senhaCoordenador !== confirmarSenhaCoordenador) {
          document.getElementById('erroConfirmarSenha').innerHTML = "As senhas não coincidem.";
          document.getElementById('erroConfirmarSenha').style.display = 'block';
          validacaoOk = false;
        }

        if (!validacaoOk) return false;

        fetch("/coordenadores/cadastrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: nomeCoordenador,
            email: emailCoordenador,
            senha: senhaCoordenador,
            confirmarSenha: confirmarSenhaCoordenador,
            fkCursinho: buscarFkCursinho()
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharModal();
            limparCadastro();
            carregarCoordenadores();
          })
          .catch((erro) => alert("Erro ao cadastrar coordenador: " + erro));
      }

      function atualizarCoordenador() {
        var id = editarId.value;
        var nomeCoordenador = editarNome.value.trim();
        var emailCoordenador = editarEmail.value.trim();
        var senhaCoordenador = editarSenha.value.trim();
        var validacaoOk = true;

        limparErrosModal('edicao');

        if (nomeCoordenador == "") {
          document.getElementById('erroEditarNome').innerHTML = "Preencha o nome.";
          document.getElementById('erroEditarNome').style.display = 'block';
          validacaoOk = false;
        }

        if (emailCoordenador == "" || emailCoordenador.indexOf("@") == -1) {
          document.getElementById('erroEditarEmail').innerHTML = "Insira um e-mail válido.";
          document.getElementById('erroEditarEmail').style.display = 'block';
          validacaoOk = false;
        }

        if (senhaCoordenador !== "" && senhaCoordenador.length < 6) {
           document.getElementById('erroEditarSenha').innerHTML = "A nova senha deve ter no mínimo 6 caracteres.";
           document.getElementById('erroEditarSenha').style.display = 'block';
           validacaoOk = false;
        }

        if (!validacaoOk) return false;

        fetch(`/coordenadores/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome: nomeCoordenador,
            email: emailCoordenador,
            senha: senhaCoordenador,
            fkCursinho: buscarFkCursinho()
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharEditar();
            carregarCoordenadores();
          })
          .catch((erro) => alert("Erro ao atualizar coordenador: " + erro));
      }

      function excluirCoordenador(id) {
        fetch(`/coordenadores/${id}`, { method: "DELETE" })
          .then((resposta) => {
            if (resposta.ok) {
              carregarCoordenadores();
            } else {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }
          })
          .catch((erro) => alert("Erro ao excluir coordenador: " + erro));
      }

      function escaparTexto(texto) {
        return String(texto || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
      }

      function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
      }

      function abrirEditar(id, nomeCoordenador, emailCoordenador) {
        editarId.value = id;
        editarNome.value = nomeCoordenador || "";
        editarEmail.value = emailCoordenador || "";
        editarSenha.value = "";
        document.getElementById("modalEditar").style.display = "flex";
      }

      function fecharEditar() {
        document.getElementById("modalEditar").style.display = "none";
      }
    </script>
  </body>
