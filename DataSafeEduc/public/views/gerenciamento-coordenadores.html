    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Sora:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

          <a href="simulados.html"

          >
        </nav>

      <!-- MAIN -->
      <main class="main-content">
        <header class="dashboard-header">
          <h1>Gerenciamento de Gestores</h1>
        </header>

        <div class="dashboard-content">
          <div class="card">
            <div
              class="card-title-row"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
              "
            >
              <h2>Lista de gestores</h2>
              <button class="btn-add" onclick="abrirModal()">
                Adicionar usuário
              </button>
            </div>

            <div class="card-content table-container">
              <table class="details-table">
                <thead>
                  <tr>
                    <th>Cod</th>
                    <th>Email</th>
                    <th>Senha</th>
                    <th>Nome cursinho</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                  </tr>

                <tbody id="tbodyCoordenadores">
                  <tr>
                    <td>01</td>

                      <button class="icon-btn" onclick="abrirEditar()">
                        ✏️
                      </button>
                    </td>
                    <td><button class="icon-btn">🗑️</button></td>
                  </tr>

                  <tr>
                    <td>02</td>
                    <td>gestor1@gmail.com</td>
                    <td>********</td>
                    <td>Alpha Brasil 1</td>
                    <td>
                      <button class="icon-btn" onclick="abrirEditar()">
                        ✏️
                      </button>
                    </td>
                    <td><button class="icon-btn">🗑️</button></td>
                  </tr>

                  <tr>
                    <td>03</td>
                    <td>gestor2@gmail.com</td>
                    <td>********</td>
                    <td>XPTO</td>
                    <td>
                      <button class="icon-btn" onclick="abrirEditar()">
                        ✏️
                      </button>
                    </td>
                    <td><button class="icon-btn">🗑️</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL CADASTRO -->
    <div class="modal" id="modalCadastro">
      <div class="modal-box">
        <h2>Cadastro de Coordenador</h2>

        <input placeholder="Nome cursinho" id="cursinho"/>
        <input placeholder="Email" id="email"/>
        <input type="password" placeholder="Senha" id="senha" />
        <input type="password" placeholder="Confirmar senha" id="confirmarSenha" />

        <select>
          <option>Gestor</option>
          <option>Coordenador</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="cadastrarCoordenador()">Cadastrar</button>
        </div>
      </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal" id="modalEditar">
      <div class="modal-box">
        <h2>Editar cadastro gestor</h2>

        <input placeholder="Nome cursinho" id="editarCursinho" />
        <input placeholder="Email" id="editarEmail" />
        <input type="password" placeholder="Nova senha" id="editarSenha" />
        <input type="hidden" id="editarId" />

        <select>
          <option>Gestor</option>
          <option>Coordenador</option>
        </select>

        <div class="modal-actions">
          <button onclick="fecharEditar()" class="btn-cancel">Cancelar</button>
          <button class="btn-add" onclick="atualizarCoordenador()">Atualizar</button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", carregarCoordenadores);

      function limparCadastro() {
        cursinho.value = "";
        email.value = "";
        senha.value = "";
        confirmarSenha.value = "";
      }

      function carregarCoordenadores() {
        fetch("/coordenadores")
          .then((resposta) => resposta.ok ? resposta.json() : [])
          .then((coordenadores) => {
            if (!coordenadores || coordenadores.length == 0) {
              tbodyCoordenadores.innerHTML = `
                <tr>
                  <td colspan="6">Nenhum coordenador encontrado</td>
                </tr>
              `;
              return;
            }

            tbodyCoordenadores.innerHTML = coordenadores.map((coordenador) => `
              <tr>
                <td>${String(coordenador.id).padStart(2, "0")}</td>
                <td>${coordenador.email || coordenador.nome}</td>
                <td>${coordenador.senha || ""}</td>
                <td>${coordenador.nomeCursinho || coordenador.municipio || ""}</td>
                <td>
                  <button class="icon-btn" onclick="abrirEditar(${coordenador.id}, '${escaparTexto(coordenador.email || coordenador.nome)}', '${escaparTexto(coordenador.nomeCursinho || coordenador.municipio || "")}')">
                    ✏️
                  </button>
                </td>
                <td>
                  <button class="icon-btn" onclick="excluirCoordenador(${coordenador.id})">🗑️</button>
                </td>
              </tr>
            `).join("");
          })
          .catch((erro) => console.log("Erro ao buscar coordenadores", erro));
      }

      function cadastrarCoordenador() {
        var nomeCursinho = cursinho.value;
        var emailCoordenador = email.value;
        var senhaCoordenador = senha.value;
        var confirmarSenhaCoordenador = confirmarSenha.value;

        if (nomeCursinho == "" || emailCoordenador == "" || senhaCoordenador == "" || confirmarSenhaCoordenador == "") {
          alert("Preencha todos os campos.");
          return false;
        }

        fetch("/coordenadores/cadastrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nomeCursinho: nomeCursinho,
            email: emailCoordenador,
            senha: senhaCoordenador,
            confirmarSenha: confirmarSenhaCoordenador
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharModal();
            limparCadastro();
            carregarCoordenadores();
          })
          .catch((erro) => alert("Erro ao cadastrar coordenador: " + erro));
      }

      function atualizarCoordenador() {
        var id = editarId.value;
        var nomeCursinho = editarCursinho.value;
        var emailCoordenador = editarEmail.value;
        var senhaCoordenador = editarSenha.value;

        if (emailCoordenador == "") {
          alert("Preencha o email.");
          return false;
        }

        fetch(`/coordenadores/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nomeCursinho: nomeCursinho,
            email: emailCoordenador,
            senha: senhaCoordenador
          })
        })
          .then((resposta) => {
            if (!resposta.ok) {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }

            fecharEditar();
            carregarCoordenadores();
          })
          .catch((erro) => alert("Erro ao atualizar coordenador: " + erro));
      }

      function excluirCoordenador(id) {
        fetch(`/coordenadores/${id}`, { method: "DELETE" })
          .then((resposta) => {
            if (resposta.ok) {
              carregarCoordenadores();
            } else {
              return resposta.text().then((mensagem) => Promise.reject(mensagem));
            }
          })
          .catch((erro) => alert("Erro ao excluir coordenador: " + erro));
      }

      function escaparTexto(texto) {
        return String(texto || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
      }

      function abrirModal() {
        document.getElementById("modalCadastro").style.display = "flex";
      }

      function fecharModal() {
        document.getElementById("modalCadastro").style.display = "none";
      }

      function abrirEditar(id, emailCoordenador, nomeCursinho) {
        editarId.value = id;
        editarEmail.value = emailCoordenador || "";
        editarCursinho.value = nomeCursinho || "";
        editarSenha.value = "";
        document.getElementById("modalEditar").style.display = "flex";
      }

      function fecharEditar() {
        document.getElementById("modalEditar").style.display = "none";
      }

    </script>
  </body>
</html>
